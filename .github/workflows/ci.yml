name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-unit:
    name: API (PHPUnit unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Keep the extension version compatible with locked mongodb/mongodb 1.21.x.
          extensions: mongodb-1.21.0, mbstring, xml, curl, zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          # Tracked vendor is incomplete (e.g. missing polyfill-php85/bootstrap80.php).
          # Install from the lockfile so CI does not reuse a partial checkout.
          rm -rf vendor
          composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  api-feature:
    name: API (PHPUnit feature, MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb-1.21.0, mbstring, xml, curl, zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          rm -rf vendor
          composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            php -r '
              try {
                $m = new MongoDB\Driver\Manager(getenv("MONGODB_URI"));
                $m->executeCommand("admin", new MongoDB\Driver\Command(["ping" => 1]));
                exit(0);
              } catch (Throwable $e) {
                exit(1);
              }
            ' && exit 0
            sleep 2
          done
          echo "MongoDB did not become ready" >&2
          exit 1

      - name: Run feature tests
        run: php artisan test --testsuite=Feature

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  flutter:
    name: Flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos